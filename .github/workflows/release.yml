name: Release

# Final releases: push a tag that EXACTLY matches manifest.json's version
# (Obsidian requires the tag to equal the version — no leading "v").
# Pre-releases: a tag like 1.2.3-rc1 builds and publishes a GitHub *pre-release*
# for smoke-testing the pipeline; the strict manifest-match is skipped for these.
#   npm version patch --no-git-tag-version   # bump manifest.json/versions.json/package.json
#   git commit -am "release 1.2.3" && git tag 1.2.3 && git push --follow-tags
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write   # needed to create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # For a FINAL tag, fail unless it equals manifest.json's version (Obsidian
      # resolves a release by matching the tag to the manifest version). Skipped
      # for pre-release tags (which contain a "-"), since those are ahead of the
      # manifest during testing.
      - name: Verify tag matches manifest version (final tags only)
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          MANIFEST_VERSION="$(node -p "require('./manifest.json').version")"
          if [ "$TAG" != "$MANIFEST_VERSION" ]; then
            echo "::error::tag ($TAG) does not match manifest.json version ($MANIFEST_VERSION)"
            exit 1
          fi

      - run: npm run typecheck
      - run: npm run build
      - run: node scripts/check-size.mjs

      # Attach the plugin files as INDIVIDUAL assets (not a zip) — this is what
      # Obsidian's installer and BRAT download by tag. Pre-release tags are
      # published as GitHub pre-releases.
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          PRERELEASE=""
          case "$TAG" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            $PRERELEASE \
            main.js manifest.json LICENSE
